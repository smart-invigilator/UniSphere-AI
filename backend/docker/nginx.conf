# Reverse proxy: serves frontend + proxies API and Socket.IO to backend.
upstream backend { server backend:8000; }

server {
    listen 80;

    location /api/      { proxy_pass http://backend; proxy_set_header Host $host; client_max_body_size 6m; }
    # Question pictures: cached hard because every file name is a random, never-reused id
    location /media/    { proxy_pass http://backend; proxy_set_header Host $host; expires 30d; add_header Cache-Control "public, immutable"; }
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
